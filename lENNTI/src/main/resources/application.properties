
# CONTEXT PATH
server.servlet.contextPath = /lentti

# SERVER
server.error.include-message=always

# DATABASE
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/LENTTI?useSSL=false}
spring.datasource.dbname = lentti
spring.datasource.username = ${DB_USERNAME:developer}
spring.datasource.password = ${DB_PASSWORD:developer}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# SWAGGER -> http://localhost:8080/lentti/swagger-ui/index.html
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER
